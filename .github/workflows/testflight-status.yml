name: TestFlight Status
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Uploaded iOS build number to inspect
        required: true
        type: string
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: testflight
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: 22.17.0}
      - name: Read Apple processing and beta distribution state
        run: node scripts/testflight-status.mjs
        env:
          TESTFLIGHT_BUILD_NUMBER: ${{ inputs.build_number }}
          ASC_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
